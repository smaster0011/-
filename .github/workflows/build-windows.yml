name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows-portable:
    name: Build Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Read application version
        shell: pwsh
        run: |
          $version = python scripts/get_version.py
          $packageName = "SubtitleMasker_v${version}_Windows_Portable"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APP_VERSION=$version"
          Write-Host "PACKAGE_NAME=$packageName"

      - name: Run syntax checks
        run: python -m compileall -q main.py src

      - name: Clean old build artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "release" -ErrorAction SilentlyContinue

      - name: Verify package imports
        shell: pwsh
        run: |
          $srcPath = Join-Path $PWD "src"
          $env:PYTHONPATH = $srcPath
          python -c "import sys; print(sys.path); import subtitle_masker; import subtitle_masker.main; print('subtitle_masker import ok:', subtitle_masker.__file__)"

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean SubtitleMasker.spec

      - name: Run executable self-test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\SubtitleMasker.exe" -ArgumentList "--self-test" -PassThru
          if (-not $proc.WaitForExit(15000)) {
            $proc.Kill()
            throw "SubtitleMasker.exe self-test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "SubtitleMasker.exe self-test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "SubtitleMasker.exe self-test passed"

      - name: Prepare portable folder
        shell: pwsh
        run: |
          $packageDir = Join-Path "release" $env:PACKAGE_NAME
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item "dist\SubtitleMasker.exe" -Destination $packageDir
          Copy-Item "README.txt" -Destination $packageDir
          Copy-Item "README.md" -Destination $packageDir
          Copy-Item "CHANGELOG.md" -Destination $packageDir
          Copy-Item "LICENSE.txt" -Destination $packageDir

          New-Item -ItemType Directory -Path (Join-Path $packageDir "docs") -Force | Out-Null
          Copy-Item "docs\PRIVACY.md" -Destination (Join-Path $packageDir "docs")
          Copy-Item "docs\UPDATE_POLICY.md" -Destination (Join-Path $packageDir "docs")

      - name: Create zip package
        shell: pwsh
        run: |
          $packageDir = Join-Path "release" $env:PACKAGE_NAME
          $zipPath = Join-Path "release" "$($env:PACKAGE_NAME).zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $packageDir -DestinationPath $zipPath
          Write-Host "Created $zipPath"

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release/${{ env.PACKAGE_NAME }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}.zip
          path: release/${{ env.PACKAGE_NAME }}.zip
